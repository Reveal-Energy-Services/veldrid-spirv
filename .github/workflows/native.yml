name: native

# Builds libveldrid-spirv.dll (win-x64) from the pinned sources (ext/known_good.json + the SPIRV-Cross
# submodule). The DLL under src/Veldrid.SPIRV/runtimes/win-x64/native is replaced by hand from this
# workflow's artifact, with the run linked in the commit message.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native.yml
      - build-native.cmd
      - CMakeLists.txt
      - ext/**
      - src/libveldrid-spirv/**

permissions:
  contents: read

env:
  # SPIRV-Cross and shaderc's pinned CMakeLists declare cmake_minimum_required < 3.5, which CMake 4 rejects.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync shaderc sources
        run: ext\sync-shaderc.cmd
        shell: cmd

      - name: Build
        run: build-native.cmd release win-x64
        shell: cmd

      - name: Check exports and dependencies
        shell: pwsh
        run: |
          $dll = 'build\Release\win-x64\libveldrid-spirv.dll'
          if (-not (Test-Path $dll)) { throw "$dll was not built" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $exports = & $dumpbin -nologo -exports $dll | Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object
          $deps = & $dumpbin -nologo -dependents $dll | Select-String '^\s+(\S+\.dll)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          "exports: $($exports -join ', ')"
          "dependencies: $($deps -join ', ')"
          # Veldrid.SPIRV P/Invokes exactly these.
          if (($exports -join ',') -ne 'CompileGlslToSpirv,CrossCompile,FreeResult') { throw 'Unexpected exports' }
          if (($deps -join ',') -ne 'KERNEL32.dll') { throw 'Unexpected dependencies (expected only KERNEL32.dll)' }
          (Get-FileHash $dll -Algorithm SHA256).Hash

      - uses: actions/upload-artifact@v4
        with:
          name: libveldrid-spirv-win-x64
          path: build/Release/win-x64/libveldrid-spirv.dll
          if-no-files-found: error
